openapi: 3.0.3
info:
  title: Google Gemini API
  description: |
    Google Gemini API 契約定義
    用於根據文稿生成結構化的影片腳本 (段落 + 圖片提示詞)
  version: v1beta
  contact:
    name: Google AI Gemini Documentation
    url: https://ai.google.dev/docs

servers:
  - url: https://generativelanguage.googleapis.com/v1beta
    description: Gemini API v1beta

security:
  - apiKey: []

paths:
  /models/gemini-pro:generateContent:
    post:
      summary: 生成腳本內容
      description: 使用 Gemini 生成結構化的影片腳本
      operationId: generateContent
      parameters:
        - name: key
          in: query
          required: true
          schema:
            type: string
          description: API 金鑰
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateContentRequest'
            example:
              contents:
                - role: "user"
                  parts:
                    - text: |
                        請根據以下文稿生成影片腳本...
              generationConfig:
                temperature: 0.7
                maxOutputTokens: 2048
              safetySettings:
                - category: "HARM_CATEGORY_HATE_SPEECH"
                  threshold: "BLOCK_MEDIUM_AND_ABOVE"
      responses:
        '200':
          description: 成功生成內容
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerateContentResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'

components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: query
      name: key

  schemas:
    GenerateContentRequest:
      type: object
      required:
        - contents
      properties:
        contents:
          type: array
          items:
            $ref: '#/components/schemas/Content'
        generationConfig:
          $ref: '#/components/schemas/GenerationConfig'
        safetySettings:
          type: array
          items:
            $ref: '#/components/schemas/SafetySetting'

    Content:
      type: object
      properties:
        role:
          type: string
          enum: ["user", "model"]
        parts:
          type: array
          items:
            $ref: '#/components/schemas/Part'

    Part:
      type: object
      properties:
        text:
          type: string
          description: 文字內容

    GenerationConfig:
      type: object
      properties:
        temperature:
          type: number
          format: float
          minimum: 0.0
          maximum: 1.0
          default: 0.7
        maxOutputTokens:
          type: integer
          default: 2048
        topP:
          type: number
          format: float
          minimum: 0.0
          maximum: 1.0
        topK:
          type: integer

    SafetySetting:
      type: object
      properties:
        category:
          type: string
          enum:
            - "HARM_CATEGORY_HATE_SPEECH"
            - "HARM_CATEGORY_SEXUALLY_EXPLICIT"
            - "HARM_CATEGORY_DANGEROUS_CONTENT"
            - "HARM_CATEGORY_HARASSMENT"
        threshold:
          type: string
          enum:
            - "BLOCK_NONE"
            - "BLOCK_LOW_AND_ABOVE"
            - "BLOCK_MEDIUM_AND_ABOVE"
            - "BLOCK_ONLY_HIGH"

    GenerateContentResponse:
      type: object
      properties:
        candidates:
          type: array
          items:
            $ref: '#/components/schemas/Candidate'
        usageMetadata:
          $ref: '#/components/schemas/UsageMetadata'

    Candidate:
      type: object
      properties:
        content:
          $ref: '#/components/schemas/Content'
        finishReason:
          type: string
          enum: ["STOP", "MAX_TOKENS", "SAFETY", "RECITATION", "OTHER"]
        safetyRatings:
          type: array
          items:
            $ref: '#/components/schemas/SafetyRating'

    SafetyRating:
      type: object
      properties:
        category:
          type: string
        probability:
          type: string

    UsageMetadata:
      type: object
      properties:
        promptTokenCount:
          type: integer
        candidatesTokenCount:
          type: integer
        totalTokenCount:
          type: integer

    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: integer
            message:
              type: string
            status:
              type: string

  responses:
    BadRequest:
      description: 請求格式錯誤
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    Unauthorized:
      description: API 金鑰無效
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    TooManyRequests:
      description: 超過呼叫限制
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

# 應用程式特定的 System Prompt (不是 API 規格的一部分)
#
# System Prompt 範例:
# """
# 你是一個專業的影片腳本生成助手。請根據使用者提供的文稿,生成結構化的影片腳本。
#
# 要求:
# 1. 將文稿分成 3-10 個段落
# 2. 每個段落 3-5 句話
# 3. 每個段落需要一個圖片提示詞 (英文)
# 4. 圖片提示詞要清晰、具體、適合視覺呈現
#
# 請以 JSON 格式回應:
# {
#   "paragraphs": [
#     {
#       "text": "段落文字內容",
#       "imagePrompt": "英文圖片提示詞",
#       "imagePromptZh": "中文圖片提示詞 (供參考)"
#     }
#   ]
# }
# """
#
# 費用計算:
# - 輸入: $0.00002 / token
# - 輸出: $0.00006 / token
# - 範例: 輸入 500 tokens, 輸出 1200 tokens
#   = (500 * $0.00002) + (1200 * $0.00006)
#   = $0.01 + $0.072 = $0.082
